<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Torric</title>
  <style>
    :root { color-scheme: light dark; --bg: #edeae4; --ink: #141414; --muted: #55524d; }
    @media (prefers-color-scheme: dark) { :root { --bg: #141414; --ink: #edeae4; --muted: #a8a49c; } }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 system-ui, sans-serif; }
    main { max-width: 640px; margin: 0 auto; padding: 32px 16px 64px; }
    h1 { font-size: 32px; line-height: 1.1; margin: 0 0 8px; }
    h2 { font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; margin: 32px 0 8px; }
    p { margin: 0 0 12px; color: var(--muted); }
    a { color: var(--ink); }
  </style>
</head>
<body>
<main>
  <h1>Torric</h1>
  <p>Music shared between listeners’ phones, peer to peer. No email, no password, no ads.</p>
  <h2>Help</h2>
  <p>Questions, problems, privacy requests and takedown notices: <a href="mailto:contact@torric.app">contact@torric.app</a>.</p>
  <h2>Privacy</h2>
  <p><a href="/privacy">The privacy policy</a>.</p>
</main>
</body>
</html>
